[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0222", reason = "Extism 1.30.0 pins Wasmtime 43; no compatible patched Extism release exists yet. WASM plugins are optional, local operator-configured inputs. Track and remove this exception as soon as Extism updates Wasmtime." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
