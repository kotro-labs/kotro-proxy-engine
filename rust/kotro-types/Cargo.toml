[package]
name = "kotro-types"
description = "Stable TaskEnvelope, Event, Action, and Decision schemas for the Kotro Agent Transaction Firewall"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/kotro-labs/kotro-proxy-engine"
homepage = "https://github.com/kotro-labs/kotro-proxy-engine"
keywords = ["llm", "ai", "agents", "security", "policy"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
base64 = "0.22"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
rand = "0.8"

[dev-dependencies]
serde_json = "1"
