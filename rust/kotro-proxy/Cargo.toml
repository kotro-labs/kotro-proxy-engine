[package]
name = "kotro-proxy"
description = "High-performance Rust port of the Kotro local LLM proxy engine"
version = "0.6.2"
edition = "2021"
license.workspace = true
authors.workspace = true

[[bin]]
name = "kotro-proxy"
path = "src/main.rs"

[dependencies]
kotro-types = { path = "../kotro-types" }
kotro-schema = { path = "../kotro-schema" }
bytes = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
futures-util = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http = "1"
regex = "1"
zstd = "0.13"
moka = { version = "0.12", features = ["sync"] }
ipnet = "2"
prometheus = "0.14"
parking_lot = "0.12"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "0.5.0"
tokenizers = "0.22"
extism = "1.30.0"
anyhow = "1.0.103"
tracing-opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.32.0", features = ["reqwest-client", "http-proto"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager"] }
hmac = "0.13"
rand = "0.9"
serde_yaml = "0.9"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "mcp_hot_path"
harness = false
