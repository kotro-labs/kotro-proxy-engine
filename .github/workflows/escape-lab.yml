name: Escape Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap gate: corpus structure only. Runs in seconds, no build required, so a
  # malformed scenario fails before anyone waits on a release build.
  validate-corpus:
    name: Validate scenario corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate corpus
        run: python3 scripts/escape-lab.py --validate

  run-matrix:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: validate-corpus
    strategy:
      fail-fast: false
      matrix:
        # One job per env group. Injection warn and block are mutually exclusive
        # proxy configs, so they cannot be exercised in a single process.
        include:
          - group: default
            env_flags: "KOTRO_MODE=enforce"
          - group: injection-warn
            env_flags: "KOTRO_MODE=enforce KOTRO_INJECTION_BLOCK=false"
          - group: injection-block
            env_flags: "KOTRO_MODE=enforce KOTRO_INJECTION_BLOCK=true"
          - group: budget
            env_flags: "KOTRO_MODE=enforce KOTRO_SESSION_TOKEN_BUDGET=200 KOTRO_BUDGET_BLOCK=true"
          - group: mode-audit
            env_flags: "KOTRO_MODE=audit KOTRO_INJECTION_BLOCK=true"
          - group: mode-disabled
            env_flags: "KOTRO_MODE=disabled KOTRO_INJECTION_BLOCK=true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build proxy and mock upstream
        run: |
          cd rust && cargo build --release -p kotro-proxy
          cd .. && go build -o bin/mock-upstream ./cmd/mockupstream

      - name: Start stack
        env:
          KOTRO_CONTROL_TOKEN: escape-lab-ci-token
          ENV_FLAGS: ${{ matrix.env_flags }}
        run: |
          ./bin/mock-upstream &
          sleep 1
          env $ENV_FLAGS \
          RUST_LOG=info \
          KOTRO_LISTEN_ADDR=127.0.0.1:8080 \
          KOTRO_UPSTREAM_URL=http://127.0.0.1:9000 \
          KOTRO_CACHE_DB=/tmp/escape-lab-cache.db \
          KOTRO_ENABLE_METRICS=true \
          KOTRO_METRICS_ADDR=127.0.0.1:9090 \
          KOTRO_ENABLE_INJECTION_SCAN=true \
          KOTRO_ENABLE_REDACTION=true \
          KOTRO_CONTROL_TOKEN=escape-lab-ci-token \
            ./rust/target/release/kotro-proxy > /tmp/kotro-proxy.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:8080/healthz || { cat /tmp/kotro-proxy.log; exit 1; }

      - name: Run Escape Lab
        env:
          KOTRO_CONTROL_TOKEN: escape-lab-ci-token
        run: |
          python3 scripts/escape-lab.py \
            --target http://127.0.0.1:8080 \
            --control-target http://127.0.0.1:9090 \
            --env-group "${{ matrix.group }}" \
            --out "/tmp/escape-lab-${{ matrix.group }}.json" \
            --markdown "/tmp/ESCAPE-LAB-${{ matrix.group }}.md"

      - name: Show proxy log on failure
        if: failure()
        run: tail -100 /tmp/kotro-proxy.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escape-lab-${{ matrix.group }}
          path: |
            /tmp/escape-lab-${{ matrix.group }}.json
            /tmp/ESCAPE-LAB-${{ matrix.group }}.md
          if-no-files-found: warn

  merge-matrix:
    name: Merge published matrix
    runs-on: ubuntu-latest
    needs: run-matrix
    if: always() && needs.run-matrix.result != 'cancelled'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download per-group results
        uses: actions/download-artifact@v4
        with:
          pattern: escape-lab-*
          path: /tmp/escape-lab-artifacts
          merge-multiple: true
      - name: Merge into one matrix
        run: |
          set -euo pipefail
          ls -la /tmp/escape-lab-artifacts
          mapfile -t FILES < <(find /tmp/escape-lab-artifacts -name 'escape-lab-*.json' | sort)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "no per-group JSON artifacts to merge" >&2
            exit 1
          fi
          python3 scripts/escape-lab.py \
            --merge "${FILES[@]}" \
            --out /tmp/escape-lab-merged.json \
            --markdown /tmp/ESCAPE-LAB-MATRIX.md \
            --allow-divergence
          # Fail the job if any measured row diverged (allow-divergence only for markdown emit).
          python3 - <<'PY'
          import json, sys
          payload = json.load(open("/tmp/escape-lab-merged.json"))
          bad = [r for r in payload["results"] if not r.get("pass")]
          if bad:
              for r in bad:
                  print(f"divergence: {r['id']} declared {r['expected']} observed {r['observed']}", file=sys.stderr)
              sys.exit(1)
          print(f"merged ok: {payload['summary']}")
          PY
      - name: Upload merged matrix
        uses: actions/upload-artifact@v4
        with:
          name: escape-lab-merged
          path: |
            /tmp/escape-lab-merged.json
            /tmp/ESCAPE-LAB-MATRIX.md
